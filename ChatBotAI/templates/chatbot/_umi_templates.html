        <!-- Quick Reply Templates -->
        <div class="settings-card">
            <div class="card-header">
                <h2><i class="fas fa-reply"></i> <span data-i18n="settings.templates.title">Schnellantwort-Vorlagen</span></h2>
            </div>
            <div class="card-body">
                <div class="templates-list" id="templatesList">
                    <!-- Populated by JavaScript -->
                </div>
                <p class="no-data" id="templatesEmpty" style="display:none;" data-i18n="settings.templates.empty">Noch keine Vorlagen erstellt</p>
                <p class="help-text" data-i18n="settings.templates.help">Vorlagen sparen Zeit bei häufig gesendeten Nachrichten. Variablen: {guest_name}, {property_name}, {check_in_time}</p>
                <button class="btn btn-secondary" onclick="openTemplateModal()">
                    <i class="fas fa-plus"></i> <span data-i18n="settings.templates.add">Vorlage hinzufügen</span>
                </button>
            </div>
        </div>
